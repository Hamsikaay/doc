version: "3.9"

services:
  # 🔵 ELASTICSEARCH
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  # 🟣 KIBANA
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  # 🟡 LOGSTASH
  logstash:
    image: logstash:8.15.0
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5000:5000/udp"
    depends_on:
      - elasticsearch

  # 🔴 REDIS
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: always

  # 🟠 RABBITMQ
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  # 🔵 FASTAPI BACKEND
  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - rabbitmq
    volumes:
      - ./backend:/app

  # 🟢 CELERY WORKER
  worker:
    build: ./backend
    command: celery -A rag.celery_app.celery worker --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - rabbitmq
      - backend
    volumes:
      - ./backend:/app

  # ⚪ PROMETHEUS
  prometheus:
    image: prom/prometheus:latest
    container_name: doc-prometheus-1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - worker

volumes:
  es-data:
